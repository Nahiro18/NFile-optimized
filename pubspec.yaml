name: nfile
description: "A Beautiful File Manager."
publish_to: 'none'
version: 1.0.44+44

environment:
  sdk: ^3.6.0

dependency_overrides:
  path: 1.9.0
  on_audio_query_platform_interface:
    git:
      url: https://github.com/Nahiro18/on_audio_query
      path: packages/on_audio_query_platform_interface


dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  permission_handler: ^12.0.1
  provider: ^6.1.2
  open_filex: ^4.4.0
  intl: ^0.20.2
  mime: ^2.0.0
  path: ^1.9.0
  photo_manager: ^3.3.0
  on_audio_query:
    git:
      url: https://github.com/Nahiro18/on_audio_query
      path: packages/on_audio_query
  photo_view: ^0.15.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  syncfusion_flutter_pdfviewer: ^33.2.6
  archive: ^3.6.1
  dart_lz4: ^1.0.0
  just_zstd: ^0.2.0
  flutter_markdown: ^0.7.3
  flutter_widget_from_html: ^0.17.2
  docx_to_text: ^1.0.1
  excel: ^4.0.6
  xml: ^6.6.1
  excel2003: ^1.0.0
  receive_sharing_intent: ^1.8.1
  dynamic_color: ^1.7.0
  url_launcher: ^6.3.2
  sqflite: ^2.4.2
  share_plus: ^12.0.2
  google_fonts: ^6.2.1
  crypto: ^3.0.3
  ftpconnect: ^2.0.10
  dartssh2: ^2.8.2
  audio_service: ^0.18.17
  device_info_plus: ^12.4.0

  # NUEVAS DEPENDENCIAS PARA SEGURIDAD
  encrypt: ^5.0.3
  event_bus: ^2.0.1
  shimmer: ^3.0.0
  get_it: ^9.2.1
  local_auth: ^3.0.2
  argon2_ffi_base: ^1.1.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: broken
      fonts:
        - asset: assets/fonts/broken.ttf
    - family: broken_filled
      fonts:
        - asset: assets/fonts/broken_filled.ttf
    - family: Ndot57
      fonts:
        - asset: assets/fonts/ndot/Ndot57-Regular.otf
    - family: NType82
      fonts:
        - asset: assets/fonts/ndot/NType82-Regular.otf
    - family: LexendDeca
      fonts:
        - asset: assets/fonts/LexendDeca/LexendDeca-Black.ttf
        - asset: assets/fonts/LexendDeca/LexendDeca-Bold.ttf
        - asset: assets/fonts/LexendDeca/LexendDeca-ExtraBold.ttf
        - asset: assets/fonts/LexendDeca/LexendDeca-ExtraLight.ttf
        - asset: assets/fonts/LexendDeca/LexendDeca-Light.ttf
        - asset: assets/fonts/LexendDeca/LexendDeca-Medium.ttf
        - asset: assets/fonts/LexendDeca/LexendDeca-Regular.ttf
        - asset: assets/fonts/LexendDeca/LexendDeca-SemiBold.ttf
        - asset: assets/fonts/LexendDeca/LexendDeca-Thin.ttf

  assets:
    - assets/ic_launcher.webp
    - assets/logo/
    - assets/l10n/
